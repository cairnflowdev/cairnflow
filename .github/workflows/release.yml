# Release build: binaries for Linux (static musl, x86_64 and aarch64) and macOS
# (aarch64), a multi-arch container image on ghcr.io, and a draft GitHub Release.
# Triggered by a `v*` tag; `workflow_dispatch` builds and uploads artifacts only,
# without a Release or an image push — use it for a dry run before tagging.
#
# Not run yet on GitHub: do one workflow_dispatch dry run in a private copy of
# the repository before the first tag. Known risks:
#   * aws-lc-sys / zstd-sys / lz4-sys build with `musl-gcc` (cc-rs picks it for
#     *-linux-musl); if not found set `CC_<target>=musl-gcc`.
#   * aarch64 Linux builds natively on `ubuntu-24.04-arm` (free for public repos).
# Binaries are built on GitHub runners only: a local build would embed local
# paths (registry, home directory) in panic messages.
# Third-party actions are pinned by commit SHA (tag in the trailing comment).
#
# The `image` job runs in the `release` environment: give that environment
# required reviewers in the repository settings, so that pushing a `v*` tag alone
# cannot publish a container image (RELEASING.md).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The repository's `[profile.release] debug = true` is for profiling; release
  # binaries keep the symbol table (named backtraces) without full debuginfo.
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  BINS: cairnflow cairn-query-worker cairn cairn-ctl

jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # cargo about reads the workspace metadata
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # crate cairn-ui embeds ui/dist at compile time; without it the release
      # binary only has a placeholder page.
      - name: build console (ui/)
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: THIRD_PARTY_LICENSES
        run: |
          cargo install cargo-about --locked --version 0.9.3
          scripts/third-party-licenses.sh dist-licenses/THIRD_PARTY_LICENSES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: ui/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: dist-licenses/THIRD_PARTY_LICENSES

  build:
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: dist-licenses
      - name: System tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools protobuf-compiler cmake
      - name: System tools (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf cmake
      - name: Rust toolchain (rust-toolchain.toml) and target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: cargo build --release
        run: |
          args=""
          for b in $BINS; do args="$args --bin $b"; done
          cargo build --release --locked --target ${{ matrix.target }} $args
      - name: check binaries
        run: |
          for b in $BINS; do
            f="target/${{ matrix.target }}/release/$b"
            file "$f"
            if [ "${{ runner.os }}" = Linux ]; then
              # Rust's musl output is "statically linked" or "static-pie linked".
              file "$f" | grep -Eq 'statically linked|static-pie linked' || {
                echo "$b is not a static binary" >&2; exit 1
              }
            fi
          done
          "target/${{ matrix.target }}/release/cairnflow" --help >/dev/null
          # No build-machine paths in the binary (home directories, registry paths).
          if strings "target/${{ matrix.target }}/release/cairnflow" | grep -E '/(Users|home)/[a-z]' | grep -vE '/(Users|home)/runner/' | head -5 | grep -q .; then
            echo "binary contains local paths" >&2; exit 1
          fi
      - name: package
        id: pkg
        shell: bash
        run: |
          name="cairnflow-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          for b in $BINS; do cp "target/${{ matrix.target }}/release/$b" "dist/$name/"; done
          cp LICENSE LICENSING.md NOTICE dist-licenses/THIRD_PARTY_LICENSES README.md "dist/$name/"
          cp docs/quickstart.md docs/self-hosting.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  image:
    needs: ui
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: dist-licenses
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/cairnflowdev/cairnflow:${{ github.ref_name }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # Draft release: a maintainer reads it and publishes it by hand (RELEASING.md).
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/THIRD_PARTY_LICENSES
