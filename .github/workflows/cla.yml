# Contributor License Agreement check (see CLA.md and CONTRIBUTING.md): blocks a
# pull request until every author has signed. Signatures are stored in a separate
# repository of the organization, so contributors' names never enter this repo.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token with write access to the signatures repository.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: main
          # Private repository of the organization that stores the signatures.
          remote-organization-name: cairnflowdev
          remote-repository-name: cla-signatures
          # The maintainer is the party the agreement is made with.
          allowlist: congphuong,dependabot[bot],github-actions[bot]
