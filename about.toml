# cargo-about configuration: generates the Rust part of THIRD_PARTY_LICENSES
# (scripts/third-party-licenses.sh). Same allow list as deny.toml.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
private = { ignore = true }
