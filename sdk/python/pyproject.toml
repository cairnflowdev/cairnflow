[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cairnflow"
version = "0.1.0b0"
description = "Python SDK for Cairnflow, a durable execution engine. No runtime dependencies."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["durable-execution", "workflow", "agents", "cairnflow"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# BIDI_STREAM: h2c (HTTP/2 cleartext, prior knowledge) on the same port as HTTP/1.1.
bidi = ["h2>=4.1,<5"]
# Faster Ed25519 verification of request identity (a pure-Python fallback is built in).
crypto = ["cryptography>=42"]

[project.urls]
Homepage = "https://cairnflow.dev"
Repository = "https://github.com/cairnflowdev/cairnflow"

[tool.hatch.build.targets.wheel]
packages = ["src/cairnflow"]

[tool.hatch.build.targets.sdist]
include = ["src/cairnflow", "README.md", "LICENSE"]
