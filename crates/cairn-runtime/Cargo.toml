[package]
name = "cairn-runtime"
description = "Cairnflow's journal and invocation state machine."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[dependencies]
bytes = { workspace = true }
cairn-protocol = { path = "../cairn-protocol" }
prost = { workspace = true }
# The SHA-256 digest chain of incremental replay (wire v5, `replay.rs`) — hardware
# SHA instructions; already a dependency of cairn-server (adds no crate to the lock).
ring = "0.17"
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Only to read `conformance/suspension-vectors.json` (CG-4).
serde_json = "1"
proptest = { workspace = true }
