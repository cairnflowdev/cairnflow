# cargo-deny configuration: license, ban and source gates for the workspace.
# Run: cargo deny check licenses bans sources
# (Advisories are gated separately by `cargo audit` with .cargo/audit.toml.)

[graph]
all-features = true

[licenses]
# Permissive licenses only. MPL-2.0 is file-level copyleft: fine to depend on
# unmodified; modified MPL files would have to be published under MPL.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
]
confidence-threshold = 0.9
# Workspace crates are BUSL-1.1 (engine) and are not published.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
